# Blueprint de Render: New > Blueprint y apunta a este repositorio.
services:
  - type: web
    name: finanzas-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./finanzas.db
      - key: SEED_DEMO_DATA
        value: "true"
      # CORS_ORIGINS no hace falta en Render: el backend ya acepta cualquier
      # subdominio de onrender.com. Agregala solo si usas un dominio propio.

  - type: web
    name: finanzas-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # IMPORTANTE: cambiala por la URL real del backend en cuanto Render la
      # genere, y vuelve a desplegar este servicio (se hornea en el build).
      - key: VITE_API_URL
        value: https://finanzas-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
