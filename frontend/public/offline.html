<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sin conexion - Finanzas</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8f9fa;
        color: #212529;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        max-width: 380px;
        width: 100%;
        text-align: center;
        background: #fff;
        border-radius: 12px;
        padding: 40px 28px;
        box-shadow: 0 6px 24px rgba(26, 26, 46, 0.08);
      }
      .badge {
        width: 68px;
        height: 68px;
        margin: 0 auto 20px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: #1a1a2e;
        color: #fff;
        font-size: 30px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #8d99ae; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
      button {
        width: 100%;
        border: 0;
        cursor: pointer;
        padding: 12px 16px;
        border-radius: 10px;
        background: #4361ee;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
      }
      button:hover { background: #3049c9; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">&#128246;</div>
      <h1>Sin conexion</h1>
      <p>
        No pudimos contactar al servidor. Revisa tu conexion a internet y vuelve a intentarlo; tus
        datos siguen guardados.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
