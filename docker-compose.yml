services:
  backend:
    build:
      context: ./backend
    container_name: finanzas-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/finanzas.db
      SECRET_KEY: cambia-esta-llave-en-produccion-por-una-aleatoria-larga
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SEED_DEMO_DATA: "true"
    volumes:
      - finanzas-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: finanzas-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  finanzas-data:
